<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ミニDuolingo</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f7f7f7; padding: 40px; }
    .card { background: white; padding: 30px; border-radius: 16px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { background: #58cc02; color: white; border: none; padding: 12px 24px; font-size: 18px; border-radius: 12px; cursor: pointer; margin: 10px; font-weight: bold; }
    button:hover { background: #46a302; }
    #result { margin-top: 20px; font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>❤️ ❤️ ❤️</h2>
    <h1>「Apple」の意味は？</h1>
    
    <button onclick="checkAnswer(true)">りんご</button>
    <button onclick="checkAnswer(false)">みかん</button>
    <button onclick="checkAnswer(false)">バナナ</button>

    <div id="result"></div>
  </div>

  <script>
    function checkAnswer(isCorrect) {
      const resultDiv = document.getElementById('result');
      if (isCorrect) {
        resultDiv.innerHTML = '🎉 正解！すごい！';
        resultDiv.style.color = '#58cc02';
      } else {
        resultDiv.innerHTML = '❌ 残念... ちがうよ';
        resultDiv.style.color = '#ff4b4b';
      }
    }
  </script>

</body>
</html>
