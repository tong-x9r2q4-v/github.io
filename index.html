<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンライン連打対戦 | TongStore</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1e272e;
      color: white;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #2f3640;
      padding: 20px;
      border-radius: 12px;
    }
    input {
      padding: 10px; font-size: 16px; width: 60%;
      border-radius: 6px; border: none; text-align: center;
    }
    button {
      padding: 10px 20px; font-size: 16px; font-weight: bold;
      border: none; border-radius: 6px; cursor: pointer; margin: 5px;
    }
    .btn-action { background: #00a8ff; color: white; }
    .btn-tap {
      background: #e1b12c; color: #2f3640;
      width: 100%; height: 120px; font-size: 28px;
      margin-top: 20px; border-radius: 12px;
    }
    .btn-tap:active { transform: scale(0.98); }
    .score-board {
      display: flex; justify-content: space-around;
      margin: 20px 0; background: #353b48; padding: 15px; border-radius: 8px;
    }
    .score-num { font-size: 32px; font-weight: bold; color: #4cd137; }
    #status { color: #fbc531; font-weight: bold; margin: 15px 0; }
  </style>
</head>
<body>

<div class="container">
  <h2>⚔️ オンライン連打対戦 ⚔️</h2>
  <div id="status">対戦相手を待っています...</div>

  <!-- 接続設定エリア -->
  <div id="setup-area">
    <p>同じ「あいことば」を入力して接続！</p>
    <input type="text" id="room-input" placeholder="例: tong123" value="tong123">
    <br><br>
    <button class="btn-action" id="host-btn">部屋を作る（1人目）</button>
    <button class="btn-action" id="join-btn" style="background:#4bcffa;">部屋に入る（2人目）</button>
  </div>

  <!-- 対戦エリア（最初は非表示） -->
  <div id="game-area" style="display: none;">
    <div class="score-board">
      <div>あなた<div class="score-num" id="my-score">0</div></div>
      <div>あいて<div class="score-num" id="peer-score" style="color:#e84118">0</div></div>
    </div>
    <button class="btn-tap" id="tap-btn" disabled>連打！連打！</button>
  </div>
</div>

<!-- PeerJSライブラリの読み込み -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
  let peer = null;
  let conn = null;
  let myScore = 0;
  let peerScore = 0;
  const TARGET_SCORE = 30; // 30回連打したら勝利

  const statusEl = document.getElementById('status');
  const setupArea = document.getElementById('setup-area');
  const gameArea = document.getElementById('game-area');
  const myScoreEl = document.getElementById('my-score');
  const peerScoreEl = document.getElementById('peer-score');
  const tapBtn = document.getElementById('tap-btn');

  // 1. 部屋を作る（ホスト側）
  document.getElementById('host-btn').addEventListener('click', () => {
    const roomId = document.getElementById('room-input').value;
    if (!roomId) return alert("あいことばを入力してください");

    // 入力した合言葉をIDにして通信を開始
    peer = new Peer(roomId);

    peer.on('open', (id) => {
      statusEl.textContent = `部屋を作成しました！相手の接続を待っています... (ID: ${id})`;
      setupArea.style.display = 'none';
      gameArea.style.display = 'block';
    });

    // 相手が接続してきたとき
    peer.on('connection', (c) => {
      conn = c;
      setupConnection();
    });

    peer.on('error', (err) => {
      alert("このあいことばは既に使用されているか、エラーが発生しました。");
    });
  });

  // 2. 部屋に入る（ゲスト側）
  document.getElementById('join-btn').addEventListener('click', () => {
    const roomId = document.getElementById('room-input').value;
    if (!roomId) return alert("あいことばを入力してください");

    peer = new Peer(); // ランダムIDで開始

    peer.on('open', () => {
      // 指定した合言葉の部屋に接続申請
      conn = peer.connect(roomId);
      setupConnection();
      setupArea.style.display = 'none';
      gameArea.style.display = 'block';
    });
  });

  // 3. 通信が繋がったあとの処理
  function setupConnection() {
    conn.on('open', () => {
      statusEl.textContent = "対戦相手が接続しました！対戦スタート！";
      tapBtn.disabled = false; // ボタンを押せるようにする
    });

    // 相手からデータが送られてきたとき（リアルタイム受信）
    conn.on('data', (data) => {
      if (data.type === 'tap') {
        peerScore = data.score;
        peerScoreEl.textContent = peerScore;
        checkWin();
      }
    });

    conn.on('close', () => {
      statusEl.textContent = "相手との接続が切れました。";
      tapBtn.disabled = true;
    });
  }

  // 4. 連打ボタンを押したときの処理
  tapBtn.addEventListener('click', () => {
    if (!conn) return;

    myScore++;
    myScoreEl.textContent = myScore;

    // 自分のスコアを相手に送信（リアルタイム送信！）
    conn.send({
      type: 'tap',
      score: myScore
    });

    checkWin();
  });

  // 5. 勝敗判定
  function checkWin() {
    if (myScore >= TARGET_SCORE) {
      statusEl.textContent = "🎉 あなたの勝利！おめでとう！";
      statusEl.style.color = "#4cd137";
      tapBtn.disabled = true;
    } else if (peerScore >= TARGET_SCORE) {
      statusEl.textContent = "💀 あなたの負け…！";
      statusEl.style.color = "#e84118";
      tapBtn.disabled = true;
    }
  }
</script>

</body>
</html>
