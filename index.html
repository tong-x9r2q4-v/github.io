<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>避けゲー（サンプル）</title>
<style>
  html,body { height:100%; margin:0; display:flex; align-items:center; justify-content:center; background:#111; color:#fff; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN", "メイリオ", Meiryo, sans-serif; }
  canvas { background:#222; border:4px solid #333; display:block; }
  .hint { position:fixed; top:12px; left:12px; font-size:14px; opacity:0.85; }
</style>
</head>
<body>
<div class="hint">左右キー / A D で移動。クリックまたはスペースで再スタート。</div>
<canvas id="game" width="480" height="640"></canvas>

<script>
// シンプルな避けゲー（キーボード＆タッチ対応）

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let player, obstacles, keys, score, running, lastSpawn, spawnInterval, startTime;

// 初期化
function reset() {
  player = { x: W/2 - 20, y: H - 80, w: 40, h: 40, speed: 6 };
  obstacles = [];
  keys = {};
  score = 0;
  running = true;
  lastSpawn = 0;
  spawnInterval = 900; // ms
  startTime = performance.now();
}

// 障害物を作る
function spawnObstacle() {
  const w = 30 + Math.random()*70;
  const x = Math.random()*(W - w);
  const speed = 2 + Math.random()*3 + Math.min((score/1000), 3); // スコアで少し速くなる
  obstacles.push({ x, y: -w, w, h: w, speed });
}

// 衝突判定（AABB）
function isColliding(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// 入力更新
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (!running && (e.key === ' ' || e.key === 'Enter')) reset();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// タッチ（左右をタップで移動）
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const x = (t.clientX - rect.left) * (canvas.width / rect.width);
  // タップ位置でプレイヤーを即移動（シンプル）
  if (x < W/2) player.x -= player.speed * 8;
  else player.x += player.speed * 8;
  if (!running) reset();
}, { passive:false });

// マウスでクリックすると再スタート
canvas.addEventListener('click', () => {
  if (!running) reset();
});

// ゲームループ
function update(dt) {
  if (!running) return;
  // 入力処理
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
  // 壁に当たらないように
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  // 障害物更新
  for (let ob of obstacles) {
    ob.y += ob.speed;
  }
  // 画面外の障害物を削除＆スコア加算
  for (let i = obstacles.length - 1; i >= 0; i--) {
    if (obstacles[i].y > H) {
      obstacles.splice(i,1);
      score += 100;
    }
  }

  // 衝突チェック
  for (let ob of obstacles) {
    if (isColliding(player, ob)) {
      running = false;
    }
  }

  // 自動出現
  lastSpawn += dt;
  if (lastSpawn > spawnInterval) {
    spawnObstacle();
    lastSpawn = 0;
    // 難易度調整（徐々に間隔を短く）
    spawnInterval = Math.max(350, spawnInterval - 8);
  }
}

// 描画
function draw() {
  // 背景
  ctx.fillStyle = '#161616';
  ctx.fillRect(0,0,W,H);

  // プレイヤー
  ctx.fillStyle = '#4ee';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  // プレイヤーの影
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(player.x+4, player.y+player.h-6, player.w-8, 6);

  // 障害物
  for (let ob of obstacles) {
    ctx.fillStyle = '#f66';
    ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
  }

  // スコア
  ctx.fillStyle = '#fff';
  ctx.font = '20px system-ui, sans-serif';
  ctx.fillText(`スコア: ${score}`, 12, 28);

  // ランニングでないときの表示
  if (!running) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H/2 - 60, W, 140);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '28px system-ui, sans-serif';
    ctx.fillText('ゲームオーバー', W/2, H/2 - 10);
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText(`最終スコア: ${score}`, W/2, H/2 + 20);
    ctx.fillText('クリックかスペースで再スタート', W/2, H/2 + 48);
    ctx.textAlign = 'start';
  }
}

// メインループ
let lastTime = performance.now();
function loop(now) {
  const dt = now - lastTime;
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// スタート
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
