<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoutaFanclub | 限定チャット</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    /* ヘッダー */
    .header {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }
    /* ログイン画面 */
    .login-box {
      padding: 30px 20px;
      text-align: center;
      flex: 1;
    }
    .price-badge {
      background: #ffeaa7;
      color: #d63031;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }
    input, select {
      width: 80%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 85%;
      padding: 12px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    /* チャットエリア */
    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #eef2f5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all;
    }
    .message.my {
      align-self: flex-end;
      background: #6c5ce7;
      color: white;
      border-bottom-right-radius: 2px;
    }
    .message.peer {
      align-self: flex-start;
      background: white;
      color: #333;
      border-bottom-left-radius: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    /* 入力エリア */
    .input-area {
      padding: 10px;
      background: white;
      display: flex;
      gap: 8px;
      border-top: 1px solid #ddd;
    }
    .input-area input {
      flex: 1;
      margin: 0;
      width: auto;
    }
    .input-area button {
      width: auto;
      margin: 0;
      padding: 10px 18px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">🌟 SoutaFanclub 🌟</div>

  <!-- ログイン画面 -->
  <div class="login-box" id="login-view">
    <div class="price-badge">月額 980円（税込）プラン適用中</div>
    <h3>限定チャットへログイン</h3>
    <p style="color:#666; font-size:14px;">役割を選択してログインしてください</p>

    <select id="role-select">
      <option value="user">ファン（会員）として入室</option>
      <option value="souta">そうた本人として入室</option>
    </select>
    <br>
    <input type="text" id="room-id" placeholder="合言葉 (例: souta123)" value="souta123">
    <br>
    <button id="login-btn">チャットを開始する</button>
  </div>

  <!-- チャット画面（最初は非表示） -->
  <div id="chat-view" style="display: none; flex-direction: column; height: 100%;">
    <div class="chat-box" id="chat-box">
      <div class="message peer" id="system-msg">接続中... 相手を待っています</div>
    </div>
    <div class="input-area">
      <input type="text" id="msg-input" placeholder="メッセージを入力...">
      <button id="send-btn">送信</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
  let peer = null;
  let conn = null;
  let myRole = 'user';

  const loginView = document.getElementById('login-view');
  const chatView = document.getElementById('chat-view');
  const chatBox = document.getElementById('chat-box');
  const msgInput = document.getElementById('msg-input');
  const systemMsg = document.getElementById('system-msg');

  document.getElementById('login-btn').addEventListener('click', () => {
    myRole = document.getElementById('role-select').value;
    const roomId = document.getElementById('room-id').value;

    if (!roomId) return alert("合言葉を入力してください");

    loginView.style.display = 'none';
    chatView.style.display = 'flex';

    if (myRole === 'souta') {
      // そうた本人が部屋を開く（ホスト）
      peer = new Peer(roomId);
      peer.on('open', () => {
        systemMsg.textContent = "ファンからの接続を待っています...";
      });
      peer.on('connection', c => {
        conn = c;
        setupChat();
      });
    } else {
      // ファンが接続する（ゲスト）
      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(roomId);
        setupChat();
      });
    }
  });

  function setupChat() {
    conn.on('open', () => {
      systemMsg.textContent = myRole === 'souta' ? "ファンが参加しました！" : "そうたさんと接続しました！チャットを楽しもう！";
    });

    // 相手からメッセージを受信
    conn.on('data', data => {
      if (data.type === 'chat') {
        appendMessage(data.text, 'peer');
      }
    });
  }

  // 送信ボタン
  document.getElementById('send-btn').addEventListener('click', sendMessage);
  msgInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !conn) return;

    // 相手に送信
    conn.send({ type: 'chat', text: text });

    // 自分の画面に表示
    appendMessage(text, 'my');
    msgInput.value = '';
  }

  function appendMessage(text, side) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${side}`;
    msgDiv.textContent = text;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight; // 自動スクロール
  }
</script>

</body>
</html>
