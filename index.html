<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TongStore AICHI 入店システム</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f4f6f8;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 450px;
      margin: 0 auto;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .status-box {
      margin: 20px 0;
      padding: 15px;
      background: #eccc68;
      border-radius: 8px;
      font-weight: bold;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    .btn-listen { background: #2ed573; color: white; }
    .btn-send { background: #ff4757; color: white; }
    
    /* 証明書のデザイン */
    #certificate {
      display: none;
      margin-top: 25px;
      padding: 25px;
      background: #fff;
      border: 4px double #ffa502;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 165, 2, 0.3);
    }
    .cert-title {
      font-size: 20px;
      color: #ff6b81;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .cert-store {
      font-size: 24px;
      font-weight: bold;
      color: #2f3542;
      margin: 15px 0;
    }
    .cert-date {
      font-size: 16px;
      color: #57606f;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📡 超音波入店チェックイン</h2>
  
  <p>「受信スタート」を押して、超音波の合図を待ちます。</p>
  
  <button class="btn-listen" id="start-btn">マイクで受信スタート</button>
  <button class="btn-send" id="send-btn">【テスト用】超音波を発信</button>

  <div class="status-box" id="status">待機中（マイクOFF）</div>

  <!-- 発行される証明書 -->
  <div id="certificate">
    <div class="cert-title">✨ WELCOME ✨</div>
    <div class="cert-store">TongStore AICHI<br>入店証明書</div>
    <hr style="border: 0.5px solid #eee;">
    <p>ご来店ありがとうございます！</p>
    <div class="cert-date" id="visit-date">入店日時: --</div>
  </div>
</div>

<script>
  let audioCtx = null;
  let analyser = null;
  let isListening = false;
  const TARGET_FREQ = 18000; // チェックイン用周波数 (18kHz)

  const startBtn = document.getElementById('start-btn');
  const sendBtn = document.getElementById('send-btn');
  const statusEl = document.getElementById('status');
  const certEl = document.getElementById('certificate');
  const dateEl = document.getElementById('visit-date');

  // 音声処理の準備
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  // 1. 超音波を受信する処理（マイクで18kHzを監視）
  startBtn.addEventListener('click', async () => {
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);

      isListening = true;
      statusEl.textContent = "📡 超音波（18kHz）を待機中...";
      statusEl.style.background = "#70a1ff";
      statusEl.style.color = "white";
      startBtn.disabled = true;

      checkSignal();
    } catch (err) {
      alert("マイクの使用許可が必要です。");
    }
  });

  function checkSignal() {
    if (!isListening) return;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);

    // 18kHz付近の音の強さを判定
    const index = Math.round(TARGET_FREQ / (audioCtx.sampleRate / analyser.fftSize));
    const volume = dataArray[index];

    // 周波数の音を検知したら証明書を発行（閾値: 100以上）
    if (volume > 100) {
      issueCertificate();
      return; // 1回検知したら停止
    }

    requestAnimationFrame(checkSignal);
  }

  // 2. 入店証明書を発行する
  function issueCertificate() {
    isListening = false;
    statusEl.textContent = "🎉 超音波を受信しました！";
    statusEl.style.background = "#2ed573";

    // 現在の日時を取得
    const now = new Date();
    const dateString = now.getFullYear() + "年" 
      + (now.getMonth() + 1) + "月" 
      + now.getDate() + "日 " 
      + String(now.getHours()).padStart(2, '0') + ":" 
      + String(now.getMinutes()).padStart(2, '0') + ":" 
      + String(now.getSeconds()).padStart(2, '0');

    dateEl.textContent = "入店日時: " + dateString;
    certEl.style.display = "block"; // 証明書を表示
  }

  // 3. テスト用に同じ画面から18kHzの音を鳴らす処理
  sendBtn.addEventListener('click', () => {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.value = TARGET_FREQ; // 18kHz
    gain.gain.value = 0.5;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    // 0.5秒だけ鳴らして止める
    setTimeout(() => {
      osc.stop();
    }, 500);
  });
</script>

</body>
</html>
