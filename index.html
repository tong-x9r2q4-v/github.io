<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多機能 タスク管理 TodoApp</title>
  <style>
    :root {
      --primary: #4b6584;
      --accent: #20bf6b;
      --danger: #eb3b5a;
      --bg: #f5f6fa;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: #2f3542;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    h1 {
      margin: 0 0 15px 0;
      font-size: 22px;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* 入力フォーム */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      background: #f1f2f6;
      padding: 15px;
      border-radius: 12px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"], select, input[type="date"] {
      padding: 10px;
      border: 1px solid #ced6e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"] { flex: 1; }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { opacity: 0.9; }

    /* フィルタータブ */
    .filter-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      border-bottom: 2px solid #f1f2f6;
      padding-bottom: 10px;
    }
    .tab-btn {
      padding: 6px 12px;
      border: none;
      background: none;
      font-size: 13px;
      color: #747d8c;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    /* タスクリスト */
    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #eccc68;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      transition: 0.2s;
    }
    .task-item.priority-高 { border-left: 5px solid #eb3b5a; }
    .task-item.priority-中 { border-left: 5px solid #fa8231; }
    .task-item.priority-低 { border-left: 5px solid #20bf6b; }

    .task-item.completed {
      opacity: 0.5;
      background: #f1f2f6;
    }
    .task-item.completed .task-text {
      text-decoration: line-through;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .task-text { font-size: 15px; font-weight: 500; }
    .task-meta { font-size: 11px; color: #a4b0be; margin-top: 3px; }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 18px;
      cursor: pointer;
      padding: 0 5px;
    }

    /* データ操作エリア */
    .data-actions {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px dashed #dcdde1;
      display: flex;
      justify-content: space-between;
    }
    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      background: #a4b0be;
    }
  </style>
</head>
<body>

<div class="app-container">
  <h1>
    📝 Todo App
    <span id="task-count" style="font-size: 14px; font-weight: normal; color: #747d8c;">0 件</span>
  </h1>

  <!-- 新規タスク入力フォーム -->
  <div class="input-group">
    <div class="input-row">
      <input type="text" id="task-input" placeholder="新しいタスクを入力...">
      <button class="btn" id="add-btn">追加</button>
    </div>
    <div class="input-row">
      <select id="priority-select">
        <option value="中">優先度：中</option>
        <option value="高">優先度：高</option>
        <option value="低">優先度：低</option>
      </select>
      <input type="date" id="date-input">
    </div>
  </div>

  <!-- 絞り込みタブ -->
  <div class="filter-tabs">
    <button class="tab-btn active" data-filter="all">すべて</button>
    <button class="tab-btn" data-filter="active">未完了</button>
    <button class="tab-btn" data-filter="completed">完了済み</button>
  </div>

  <!-- タスク表示エリア -->
  <ul class="task-list" id="task-list"></ul>

  <!-- 外部データ保存・復元（JSON） -->
  <div class="data-actions">
    <button class="btn btn-sm" id="export-btn">📥 バックアップ出力 (JSON)</button>
    <button class="btn btn-sm" id="clear-btn" style="background: var(--danger);">全削除</button>
  </div>
</div>

<script>
  // 1. 状態（State）管理
  let tasks = JSON.parse(localStorage.getItem('my_todos')) || [];
  let currentFilter = 'all';

  // DOM要素
  const taskInput = document.getElementById('task-input');
  const prioritySelect = document.getElementById('priority-select');
  const dateInput = document.getElementById('date-input');
  const addBtn = document.getElementById('add-btn');
  const taskList = document.getElementById('task-list');
  const taskCount = document.getElementById('task-count');
  const filterTabs = document.querySelectorAll('.tab-btn');

  // 初期化レンダー
  render();

  // 2. タスク追加処理
  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) return alert("タスク名を入力してください");

    const newTask = {
      id: Date.now(),
      text: text,
      priority: prioritySelect.value,
      dueDate: dateInput.value || '期限なし',
      completed: false
    };

    tasks.unshift(newTask); // 配列の先頭に追加
    saveAndRender();

    // フォーム初期化
    taskInput.value = '';
    dateInput.value = '';
  }

  // 3. タスク完了 / 削除処理
  function toggleComplete(id) {
    tasks = tasks.map(task => 
      task.id === id ? { ...task, completed: !task.completed } : task
    );
    saveAndRender();
  }

  function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    saveAndRender();
  }

  // 4. データ保存（localStorage）
  function saveData() {
    localStorage.setItem('my_todos', JSON.stringify(tasks));
  }

  function saveAndRender() {
    saveData();
    render();
  }

  // 5. 画面描画（フィルタリング機能含む）
  function render() {
    taskList.innerHTML = '';

    // フィルタリング
    const filteredTasks = tasks.filter(task => {
      if (currentFilter === 'active') return !task.completed;
      if (currentFilter === 'completed') return task.completed;
      return true;
    });

    // 件数更新
    taskCount.textContent = `${filteredTasks.length} / ${tasks.length} 件`;

    // HTML要素の生成
    filteredTasks.forEach(task => {
      const li = document.createElement('li');
      li.className = `task-item priority-${task.priority} ${task.completed ? 'completed' : ''}`;
      
      li.innerHTML = `
        <div class="task-left">
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleComplete(${task.id})">
          <div>
            <div class="task-text">${escapeHTML(task.text)}</div>
            <div class="task-meta">期限: ${task.dueDate} | 優先度: ${task.priority}</div>
          </div>
        </div>
        <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
      `;

      taskList.appendChild(li);
    });
  }

  // XSS対策のHTMLエスケープ
  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // 6. フィルタータブ切り替え
  filterTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      filterTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      render();
    });
  });

  // 7. データバックアップ機能（JSONファイル保存）
  document.getElementById('export-btn').addEventListener('click', () => {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `todo_backup_${Date.now()}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  });

  // 8. 全削除
  document.getElementById('clear-btn').addEventListener('click', () => {
    if (confirm("本当にすべてのタスクを削除しますか？")) {
      tasks = [];
      saveAndRender();
    }
  });
</script>

</body>
</html>
