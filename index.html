<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンライン宝探し対戦</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #2c3e50;
      color: #ecf0f1;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      background: #34495e;
      padding: 20px;
      border-radius: 12px;
    }
    #status {
      background: #16a085;
      padding: 10px;
      border-radius: 6px;
      margin: 15px 0;
      font-weight: bold;
    }
    input {
      padding: 10px; font-size: 16px; width: 60%;
      border-radius: 6px; border: none; text-align: center;
    }
    button {
      padding: 10px 15px; font-size: 15px; font-weight: bold;
      border: none; border-radius: 6px; cursor: pointer; margin: 5px;
    }
    .btn-main { background: #e67e22; color: white; }
    .btn-sub { background: #2980b9; color: white; }

    /* マス目のスタイル */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 15px 0;
    }
    .cell {
      width: 100%;
      aspect-ratio: 1;
      background: #bdc3c7;
      color: #333;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }
    .cell.has-my-treasure { background: #f1c40f; } /* 自分の宝 */
    .cell.hit { background: #e74c3c; color: white; } /* 宝発見！ */
    .cell.miss { background: #7f8c8d; color: white; } /* ハズレ */
  </style>
</head>
<body>

<div class="container">
  <h2>🏴‍☠️ リアルタイム宝探し 🏴‍☠️</h2>
  <div id="status">あいことばを決めて接続してください</div>

  <!-- 接続エリア -->
  <div id="setup-area">
    <input type="text" id="room-input" value="treasure123">
    <br>
    <button class="btn-main" id="host-btn">部屋を作る（1人目）</button>
    <button class="btn-sub" id="join-btn">部屋に入る（2人目）</button>
  </div>

  <!-- ゲームエリア -->
  <div id="game-area" style="display: none;">
    <h3 id="phase-title">【フェーズ1】宝を3つ隠そう！</h3>
    
    <!-- 5x5 グリッド -->
    <div class="grid" id="grid"></div>

    <button class="btn-main" id="ready-btn" style="width:100%; display:none;">宝の配置を確定！</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
  const GRID_SIZE = 5;
  const TREASURE_COUNT = 3;

  let peer = null, conn = null;
  let myTreasures = [];    // 自分の宝の位置 (0~24)
  let peerTreasures = [];  // 相手の宝の位置（確定後に受取）
  let myFoundCount = 0;    // 自分が発見した相手の宝の数
  let peerFoundCount = 0;  // 相手が発見した自分の宝の数
  let isMyTurn = false;
  let phase = 'setup';     // 'setup' -> 'waiting' -> 'battle'

  const statusEl = document.getElementById('status');
  const setupArea = document.getElementById('setup-area');
  const gameArea = document.getElementById('game-area');
  const gridEl = document.getElementById('grid');
  const readyBtn = document.getElementById('ready-btn');
  const phaseTitle = document.getElementById('phase-title');

  // 1. 接続処理
  document.getElementById('host-btn').addEventListener('click', () => initPeer(true));
  document.getElementById('join-btn').addEventListener('click', () => initPeer(false));

  function initPeer(isHost) {
    const roomId = document.getElementById('room-input').value;
    if (!roomId) return alert("あいことばを入力してください");

    peer = isHost ? new Peer(roomId) : new Peer();
    
    peer.on('open', id => {
      statusEl.textContent = isHost ? `部屋作成！相手を待っています...` : `接続中...`;
      if (!isHost) {
        conn = peer.connect(roomId);
        setupConnection();
      }
    });

    if (isHost) {
      peer.on('connection', c => {
        conn = c;
        setupConnection();
      });
    }
  }

  function setupConnection() {
    conn.on('open', () => {
      setupArea.style.display = 'none';
      gameArea.style.display = 'block';
      statusEl.textContent = `接続完了！自分の盤面に宝を3つ隠してください。`;
      createGrid();
    });

    conn.on('data', data => {
      // 相手が宝の配置を完了した
      if (data.type === 'ready') {
        peerTreasures = data.treasures;
        checkBothReady();
      }
      // 相手がこちらのマスを攻撃（探してきた）
      else if (data.type === 'attack') {
        handleAttacked(data.index);
      }
      // 自分の攻撃結果が返ってきた
      else if (data.type === 'attack_result') {
        handleAttackResult(data.index, data.isHit);
      }
    });
  }

  // 2. グリッド画面の作成（0〜24の25マス）
  function createGrid() {
    gridEl.innerHTML = '';
    for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.addEventListener('click', () => handleCellClick(i, cell));
      gridEl.appendChild(cell);
    }
  }

  // 3. マス目がタップされたときの処理
  function handleCellClick(index, cell) {
    // 【フェーズ1：宝を隠す】
    if (phase === 'setup') {
      if (myTreasures.includes(index)) {
        // 解除
        myTreasures = myTreasures.filter(i => i !== index);
        cell.classList.remove('has-my-treasure');
        cell.textContent = '';
      } else if (myTreasures.length < TREASURE_COUNT) {
        // 選択
        myTreasures.push(index);
        cell.classList.add('has-my-treasure');
        cell.textContent = '💎';
      }
      readyBtn.style.display = (myTreasures.length === TREASURE_COUNT) ? 'block' : 'none';
    }
    // 【フェーズ2：対戦（攻撃）】
    else if (phase === 'battle') {
      if (!isMyTurn) return alert("相手のターンです！");
      if (cell.classList.contains('hit') || cell.classList.contains('miss')) return;

      // 相手に「このマスを探すよ！」と送信
      conn.send({ type: 'attack', index: index });
      isMyTurn = false;
      statusEl.textContent = "相手の判定を待っています...";
    }
  }

  // 宝配置完了ボタン
  readyBtn.addEventListener('click', () => {
    phase = 'waiting';
    readyBtn.style.display = 'none';
    statusEl.textContent = "相手が宝を隠すのを待っています...";
    
    // 相手に自分の宝の位置を送信
    conn.send({ type: 'ready', treasures: myTreasures });
    checkBothReady();
  });

  function checkBothReady() {
    if (myTreasures.length === TREASURE_COUNT && peerTreasures.length === TREASURE_COUNT) {
      phase = 'battle';
      phaseTitle.textContent = "【フェーズ2】相手の宝を探せ！";
      // 盤面をクリアして「相手の宝を探す画面」にする
      createGrid();
      
      // ホストが先攻
      isMyTurn = peer.id !== conn.peer; 
      updateTurnStatus();
    }
  }

  function updateTurnStatus() {
    statusEl.textContent = isMyTurn ? "⚔️ あなたのターン！マスを選んで探そう！" : "🛡️ 相手のターンです...";
  }

  // 相手から攻撃されたときの判定処理
  function handleAttacked(index) {
    const isHit = myTreasures.includes(index);
    if (isHit) peerFoundCount++;

    // 攻撃結果を相手に返信する
    conn.send({ type: 'attack_result', index: index, isHit: isHit });

    if (peerFoundCount >= TREASURE_COUNT) {
      statusEl.textContent = "💀 相手にすべての宝が見つけられました... あなたの負け！";
      phase = 'end';
    } else {
      isMyTurn = true;
      updateTurnStatus();
    }
  }

  // 自分の攻撃結果を受け取ったときの画面更新
  function handleAttackResult(index, isHit) {
    const cell = gridEl.children[index];
    if (isHit) {
      cell.classList.add('hit');
      cell.textContent = '💥';
      myFoundCount++;
    } else {
      cell.classList.add('miss');
      cell.textContent = '🌊';
    }

    if (myFoundCount >= TREASURE_COUNT) {
      statusEl.textContent = "🎉 相手の宝をすべて発見！あなたの勝ち！";
      phase = 'end';
    }
  }
</script>

</body>
</html>
