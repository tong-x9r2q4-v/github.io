<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TongStore 傾き玉転がし</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #2f3542;
      color: white;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden; /* スクロール防止 */
      touch-action: none;
    }
    header {
      padding: 10px;
      background: #1e222d;
    }
    h1 { font-size: 18px; margin: 0; }
    p { font-size: 12px; margin: 5px 0 0; color: #a4b0be; }

    /* ステージ */
    #stage {
      position: relative;
      width: 320px;
      height: 400px;
      background-color: #57606f;
      margin: 20px auto;
      border-radius: 16px;
      border: 4px solid #ffa502;
      overflow: hidden;
    }

    /* ボール */
    #ball {
      position: absolute;
      width: 30px;
      height: 30px;
      background: radial-gradient(circle at 10px 10px, #ff4757, #2ed573);
      border-radius: 50%;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
      top: 0;
      left: 0;
    }

    /* ゴール */
    #goal {
      position: absolute;
      width: 50px;
      height: 50px;
      background-color: #ffa502;
      border: 3px dashed #fff;
      border-radius: 50%;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
    }

    /* iPhone用 許可ボタン */
    #perm-btn {
      padding: 10px 20px;
      background: #2ed573;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      margin-top: 10px;
      display: none; /* 初期状態は非表示 */
    }
  </style>
</head>
<body>

<header>
  <h1>📱 スマホを傾けてゴールを目指せ！</h1>
  <p>TongStore 玉転がしチャレンジ</p>
</header>

<button id="perm-btn">センサーの使用を許可する</button>

<div id="stage">
  <div id="goal">GOAL</div>
  <div id="ball"></div>
</div>

<p id="info">スマホを傾けてみよう！</p>

<script>
  const stage = document.getElementById('stage');
  const ball = document.getElementById('ball');
  const goal = document.getElementById('goal');
  const info = document.getElementById('info');
  const permBtn = document.getElementById('perm-btn');

  // ステージのサイズとボールの初期位置
  const stageWidth = 320;
  const stageHeight = 400;
  const ballSize = 30;

  let x = 20; // 初期位置 X
  let y = 20; // 初期位置 Y
  let vx = 0; // 速度 X
  let vy = 0; // 速度 Y

  // iPhone(iOS 13以降)ではセンサーの許可ダイアログが必要
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    permBtn.style.display = 'inline-block';
    permBtn.addEventListener('click', () => {
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') {
          permBtn.style.display = 'none';
          window.addEventListener('deviceorientation', handleOrientation);
        } else {
          alert('センサーの許可が得られませんでした。');
        }
      });
    });
  } else {
    // AndroidやiOSの古いバージョン
    window.addEventListener('deviceorientation', handleOrientation);
  }

  // 傾き検知処理
  function handleOrientation(event) {
    // gamma: 左右の傾き (-90 〜 90)
    // beta: 前後の傾き (-180 〜 180)
    const gamma = event.gamma || 0;
    const beta = event.beta || 0;

    // 傾きを速度に変換（少しマイルドにするために0.1を掛ける）
    vx += gamma * 0.05;
    vy += beta * 0.05;

    info.textContent = `左右: ${Math.round(gamma)}° | 前後: ${Math.round(beta)}°`;
  }

  // アニメーションループ（約1秒間に60回実行）
  function update() {
    // 摩擦（だんだん減速させる）
    vx *= 0.95;
    vy *= 0.95;

    // 位置の更新
    x += vx;
    y += vy;

    // 壁との当たり判定（はみ出さないように）
    if (x < 0) { x = 0; vx *= -0.5; }
    if (x > stageWidth - ballSize) { x = stageWidth - ballSize; vx *= -0.5; }
    if (y < 0) { y = 0; vy *= -0.5; }
    if (y > stageHeight - ballSize) { y = stageHeight - ballSize; vy *= -0.5; }

    // ボールの位置を画面に反映
    ball.style.left = x + 'px';
    ball.style.top = y + 'px';

    // ゴール判定
    const goalX = stageWidth - 70;
    const goalY = stageHeight - 70;
    if (x > goalX && y > goalY) {
      info.textContent = "🎉 CLEAR! ゴールおめでとう！";
      info.style.color = "#ffa502";
      info.style.fontWeight = "bold";
    }

    requestAnimationFrame(update);
  }

  // ゲームの動きをスタート
  update();
</script>

</body>
</html>
